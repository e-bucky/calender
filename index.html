<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>To DO Calender</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 800px;
  margin: auto;
  padding: 20px;
}
h1, h2 {
  text-align: center;
}

/* 共通 */
select, input, button {
  padding: 6px;
  margin: 5px 0;
}

/* カレンダー */
.calendar {
  margin: 20px 0;
}
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  text-align: center;
}
.day-name {
  font-weight: bold;
}
.day {
  padding: 10px;
  border: 1px solid #ccc;
}
.today {
  background: #4caf50;
  color: white;
  border-radius: 5px;
}

/* ToDo */
ul {
  padding-left: 0;
}
li {
  list-style: none;
  cursor: pointer;
  margin: 5px 0;
}
li.done {
  text-decoration: line-through;
  color: gray;
}
</style>
</head>

<body>

<h1>To DO Calender</h1>

<!-- 言語切替 -->
<label>
  Language:
  <select id="languageSelect">
    <option value="ja">日本語</option>
    <option value="en">English</option>
    <option value="zh-cn">中文（简体）</option>
    <option value="zh-tw">中文（繁體）</option>
    <option value="ko">한국어</option>
  </select>
</label>

<!-- カレンダー -->
<div class="calendar">
  <div class="calendar-header">
    <button id="prevMonth">◀</button>
    <h2 id="monthYear"></h2>
    <button id="nextMonth">▶</button>
  </div>

  <div class="calendar-grid" id="dayNames"></div>
  <div class="calendar-grid" id="calendarDays"></div>
</div>

<!-- ToDo -->
<h2 id="todoTitle">ToDoリスト</h2>
<input type="text" id="todoInput" placeholder="やることを入力">
<button id="addBtn">追加</button>
<ul id="todoList"></ul>

<script>
/* 多言語テキスト */
const texts = {
  ja: {
    days: ["日","月","火","水","木","金","土"],
    todoTitle: "ToDoリスト",
    placeholder: "やることを入力",
    add: "追加",
    locale: "ja-JP"
  },
  en: {
    days: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    todoTitle: "ToDo List",
    placeholder: "Enter a task",
    add: "Add",
    locale: "en-US"
  },
  "zh-cn": {
    days: ["日","一","二","三","四","五","六"],
    todoTitle: "待办事项",
    placeholder: "输入任务",
    add: "添加",
    locale: "zh-CN"
  },
  "zh-tw": {
    days: ["日","一","二","三","四","五","六"],
    todoTitle: "待辦事項",
    placeholder: "輸入任務",
    add: "新增",
    locale: "zh-TW"
  },
  ko: {
    days: ["일","월","화","수","목","금","토"],
    todoTitle: "할 일 목록",
    placeholder: "할 일을 입력하세요",
    add: "추가",
    locale: "ko-KR"
  }
};

let currentDate = new Date();

const langSelect = document.getElementById("languageSelect");
const dayNamesEl = document.getElementById("dayNames");
const calendarDaysEl = document.getElementById("calendarDays");
const monthYearEl = document.getElementById("monthYear");

/* カレンダー描画 */
function renderCalendar() {
  const lang = langSelect.value;
  const t = texts[lang];

  dayNamesEl.innerHTML = "";
  calendarDaysEl.innerHTML = "";

  // 曜日表示
  t.days.forEach(d => {
    const div = document.createElement("div");
    div.className = "day-name";
    div.textContent = d;
    dayNamesEl.appendChild(div);
  });

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  // 月表示（ローカライズ）
  monthYearEl.textContent = new Date(year, month)
    .toLocaleDateString(t.locale, { year: "numeric", month: "long" });

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  // 空白
  for (let i = 0; i < firstDay; i++) {
    calendarDaysEl.appendChild(document.createElement("div"));
  }

  // 日付
  for (let d = 1; d <= lastDate; d++) {
    const div = document.createElement("div");
    div.className = "day";
    div.textContent = d;

    const today = new Date();
    if (
      d === today.getDate() &&
      month === today.getMonth() &&
      year === today.getFullYear()
    ) {
      div.classList.add("today");
    }
    calendarDaysEl.appendChild(div);
  }
}

/* 月切替 */
document.getElementById("prevMonth").onclick = () => {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
};
document.getElementById("nextMonth").onclick = () => {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
};

/* 言語切替 */
langSelect.onchange = () => {
  const t = texts[langSelect.value];
  document.getElementById("todoTitle").textContent = t.todoTitle;
  document.getElementById("todoInput").placeholder = t.placeholder;
  document.getElementById("addBtn").textContent = t.add;
  renderCalendar();
};

/* ToDo */
document.getElementById("addBtn").onclick = () => {
  const input = document.getElementById("todoInput");
  if (!input.value) return;

  const li = document.createElement("li");
  li.textContent = input.value;
  li.onclick = () => li.classList.toggle("done");

  document.getElementById("todoList").appendChild(li);
  input.value = "";
};

/* 初期化 */
renderCalendar();
</script>

</body>
</html>
