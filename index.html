<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Multilingual Todo ＋ Calendar</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:20px;
  background:#f5f5f5;
}

h1{text-align:center;}

.container{
  display:flex;
  gap:30px;
}

.todo-section, .calendar-section{
  background:white;
  padding:15px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.todo-section{width:40%;}
.calendar-section{width:60%;}

.todo-input{
  display:flex;
  gap:5px;
  margin-bottom:10px;
}

.todo-input input, button, select{
  padding:5px;
}

ul{list-style:none; padding:0;}

li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 0;
}

.done{
  text-decoration:line-through;
  color:gray;
}

/* Calendar */
.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day-name{
  font-weight:bold;
  text-align:center;
}

.day{
  min-height:80px;
  background:#fafafa;
  padding:5px;
  border-radius:5px;
  cursor:pointer;
}

.today{
  background:#e0f0ff;
}

.day-number{
  font-weight:bold;
  font-size:14px;
}

.calendar-todo{
  font-size:12px;
  background:#d0ebff;
  margin-top:3px;
  padding:2px 4px;
  border-radius:3px;
}
</style>
</head>

<body>

<h1>Todo with Calendar</h1>

<div style="text-align:right; margin-bottom:10px;">
<select id="language">
  <option value="ja">日本語</option>
  <option value="en">English</option>
  <option value="zh-CN">中文（简体）</option>
  <option value="zh-TW">中文（繁體）</option>
  <option value="ko">한국어</option>
</select>
</div>

<div class="container">

<div class="todo-section">
  <div class="todo-input">
    <input type="text" id="todoInput">
    <input type="date" id="dueDate">
    <button id="addBtn"></button>
  </div>
  <ul id="todoList"></ul>
</div>

<div class="calendar-section">
  <div class="calendar-header">
    <button id="prevMonth">◀</button>
    <h2 id="monthYear"></h2>
    <button id="nextMonth">▶</button>
  </div>
  <div class="calendar-grid" id="dayNames"></div>
  <div class="calendar-grid" id="calendarDays"></div>
</div>

</div>

<script>
const todoInput=document.getElementById("todoInput");
const dueDate=document.getElementById("dueDate");
const addBtn=document.getElementById("addBtn");
const todoList=document.getElementById("todoList");
const language=document.getElementById("language");

const monthYear=document.getElementById("monthYear");
const dayNames=document.getElementById("dayNames");
const calendarDays=document.getElementById("calendarDays");
const prevMonth=document.getElementById("prevMonth");
const nextMonth=document.getElementById("nextMonth");

let todos=JSON.parse(localStorage.getItem("todos"))||[];
let currentDate=new Date();

const texts={
  "ja":{
    add:"追加",
    placeholder:"タスクを入力",
    deleteConfirm:"このタスクを削除しますか？",
    days:["日","月","火","水","木","金","土"],
    locale:"ja-JP"
  },
  "en":{
    add:"Add",
    placeholder:"Enter task",
    deleteConfirm:"Delete this task?",
    days:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    locale:"en-US"
  },
  "zh-CN":{
    add:"添加",
    placeholder:"输入任务",
    deleteConfirm:"确定删除该任务？",
    days:["日","一","二","三","四","五","六"],
    locale:"zh-CN"
  },
  "zh-TW":{
    add:"新增",
    placeholder:"輸入任務",
    deleteConfirm:"確定刪除此任務？",
    days:["日","一","二","三","四","五","六"],
    locale:"zh-TW"
  },
  "ko":{
    add:"추가",
    placeholder:"할 일을 입력",
    deleteConfirm:"이 작업을 삭제하시겠습니까?",
    days:["일","월","화","수","목","금","토"],
    locale:"ko-KR"
  }
};

function save(){
  localStorage.setItem("todos",JSON.stringify(todos));
}

function renderTodo(){
  todoList.innerHTML="";
  const t=texts[language.value];

  todos.forEach((todo,index)=>{
    const li=document.createElement("li");

    const span=document.createElement("span");
    span.textContent=todo.text+" ("+todo.due+")";
    if(todo.done) span.classList.add("done");

    span.onclick=()=>{
      todo.done=!todo.done;
      save();
      renderTodo();
      renderCalendar();
    };

    const del=document.createElement("button");
    del.textContent="×";
    del.onclick=()=>{
      if(confirm(t.deleteConfirm)){
        todos.splice(index,1);
        save();
        renderTodo();
        renderCalendar();
      }
    };

    li.append(span,del);
    todoList.appendChild(li);
  });
}

function renderCalendar(){
  const t=texts[language.value];
  dayNames.innerHTML="";
  calendarDays.innerHTML="";

  t.days.forEach(d=>{
    const el=document.createElement("div");
    el.className="day-name";
    el.textContent=d;
    dayNames.appendChild(el);
  });

  const year=currentDate.getFullYear();
  const month=currentDate.getMonth();
  const today=new Date();

  monthYear.textContent=
    new Date(year,month)
    .toLocaleDateString(t.locale,{year:"numeric",month:"long"});

  const firstDay=new Date(year,month,1).getDay();
  const lastDate=new Date(year,month+1,0).getDate();

  for(let i=0;i<firstDay;i++)
    calendarDays.appendChild(document.createElement("div"));

  for(let d=1; d<=lastDate; d++){
    const div=document.createElement("div");
    div.className="day";

    const dateStr=
      year+"-"+String(month+1).padStart(2,"0")+
      "-"+String(d).padStart(2,"0");

    const num=document.createElement("div");
    num.className="day-number";
    num.textContent=d;
    div.appendChild(num);

    if(d===today.getDate() &&
       month===today.getMonth() &&
       year===today.getFullYear()){
      div.classList.add("today");
    }

    div.onclick=()=>{ dueDate.value=dateStr; };

    todos
      .filter(td=>td.due===dateStr)
      .forEach(td=>{
        const tdiv=document.createElement("div");
        tdiv.className="calendar-todo";
        tdiv.textContent=td.text;
        div.appendChild(tdiv);
      });

    calendarDays.appendChild(div);
  }
}

function updateLanguage(){
  const t=texts[language.value];
  addBtn.textContent=t.add;
  todoInput.placeholder=t.placeholder;
  renderTodo();
  renderCalendar();
}

addBtn.onclick=()=>{
  if(todoInput.value && dueDate.value){
    todos.push({
      text:todoInput.value,
      due:dueDate.value,
      done:false
    });
    todoInput.value="";
    save();
    renderTodo();
    renderCalendar();
  }
};

prevMonth.onclick=()=>{
  currentDate.setMonth(currentDate.getMonth()-1);
  renderCalendar();
};

nextMonth.onclick=()=>{
  currentDate.setMonth(currentDate.getMonth()+1);
  renderCalendar();
};

language.onchange=updateLanguage;

updateLanguage();
</script>

</body>
</html>
